/* Storage shim: if native localStorage throws (locked-down WebViews, private mode),
   swap in a memory-backed replacement so benches keep working. */
(function () {
  var ok = false;
  try { window.localStorage.setItem("__pg_probe__", "1"); window.localStorage.removeItem("__pg_probe__"); ok = true; }
  catch (e) { ok = false; }
  if (ok) return;
  var mem = {};
  var shim = {
    getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
    setItem: function (k, v) { mem[String(k)] = String(v); },
    removeItem: function (k) { delete mem[k]; },
    clear: function () { mem = {}; },
    key: function (i) { var ks = Object.keys(mem); return (i >= 0 && i < ks.length) ? ks[i] : null; }
  };
  Object.defineProperty(shim, "length", { get: function () { return Object.keys(mem).length; } });
  try { Object.defineProperty(window, "localStorage", { value: shim, configurable: true, writable: true }); }
  catch (e2) { try { window.localStorage = shim; } catch (e3) {} }
})();

:root {
  --ink: #0a0c0e;
  --panel: #10141a;
  --panel-2: #141a21;
  --paper: #f2ede3;
  --steel: #9aa3ad;
  --dim: #6b7480;
  --line: rgba(242, 237, 227, 0.13);
  --ember: #ff5a1f;
  --ember-deep: #b53c0d;
  --ember-glow: rgba(255, 90, 31, 0.35);
  --bad: #ff5d5d;
  --ice: #7cc4ff;
  --amber: #ffbe4d;
  --mint: #7de0a8;
  /* Legacy garage vars used inside bench modules: aliased to the new palette
     so module chrome (borders, toasts, accents) renders in the new identity. */
  --acid: #ff5a1f;
  --cyan: #7cc4ff;
  --orange: #ffbe4d;
  --black: #05070a;

  --font-d: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-pop: cubic-bezier(0.2, 0.9, 0.25, 1.12);
  --t-fast: 140ms; --t-base: 240ms; --t-slow: 520ms;
  --ease-pop: cubic-bezier(0.2, 0.9, 0.25, 1.12);
  --ease-spring: cubic-bezier(0.2, 0.9, 0.25, 1.15);

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-d);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  background-image:
    linear-gradient(rgba(242, 237, 227, 0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(242, 237, 227, 0.022) 1px, transparent 1px);
  background-size: 44px 44px;
}
body.pg-locked { overflow: hidden; }
::selection { background: var(--ember); color: #0a0c0e; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: #2a323c; border-radius: 8px; border: 2px solid var(--ink); }
::-webkit-scrollbar-thumb:hover { background: var(--ember-deep); }
a { color: var(--ember); }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px; }

/* Skip link: keyboard users jump straight to the benches. */
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 200;
  background: var(--ember); color: #0a0c0e; font-family: var(--font-m);
  font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 4px;
  text-decoration: none; transition: top 0.18s var(--ease-out);
}
.skip:focus { top: 12px; }

/* ---------- Hero ---------- */
.site-head { position: relative; padding: 52px 0 10px; overflow: hidden; }
.head-row {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 30px; animation: rise 0.6s var(--ease-out) both;
}
.sigil { width: 46px; height: 46px; flex: none; }
/* Boot sequence: the sigil draws itself, then the core ignites. */
.sigil .draw-ring {
  stroke-dasharray: 132; stroke-dashoffset: 132;
  animation: sigilDraw 1.1s var(--ease-out) 0.1s forwards;
}
.sigil .draw-core { opacity: 0; animation: sigilIn 0.45s var(--ease-out) 0.85s forwards; }
@keyframes sigilDraw { to { stroke-dashoffset: 0; } }
@keyframes sigilIn { to { opacity: 1; } }
.sysstat {
  font-family: var(--font-m); font-size: 12px; font-weight: 500;
  letter-spacing: 0.18em; color: var(--dim);
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
}
.sysstat b { color: var(--paper); font-weight: 600; }
/* Status lamp: flat and static. The words beside it carry the meaning. */
.pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ember); flex: none;
}
.wordmark {
  position: relative; margin: 0;
  font-size: clamp(58px, 13vw, 132px); font-weight: 700; line-height: 0.94;
  letter-spacing: -0.03em; text-wrap: balance;
}
/* Boot sequence: each line rises out of its mask, like a press stamping. */
.wl { display: block; overflow: hidden; padding-bottom: 0.06em; margin-bottom: -0.06em; }
.wl > span { display: block; animation: wlUp 0.9s var(--ease-out) 0.25s both; }
.wl:nth-child(2) > span { animation-delay: 0.37s; }
@keyframes wlUp {
  from { opacity: 0; transform: translateY(112%); }
  to { opacity: 1; transform: none; }
}
.wordmark .outline { color: transparent; -webkit-text-stroke: 1.5px var(--paper); }
@supports not (-webkit-text-stroke: 1px #000) { .wordmark .outline { color: var(--paper); } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

/* ---------- Filter deck (sticky glass; the grid melts beneath it) ---------- */
.deck {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 0; margin: 30px 0 6px;
  background: rgba(10, 12, 14, 0.9);
  background: linear-gradient(to bottom,
    color-mix(in srgb, var(--ink) 90%, transparent),
    color-mix(in srgb, var(--ink) 72%, transparent));
  -webkit-backdrop-filter: blur(22px) saturate(1.35);
  backdrop-filter: blur(22px) saturate(1.35);
  border-bottom: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(242, 237, 227, 0.05);
}
/* Frosted lower edge: bench cards dissolve softly as they slide under. */
.deck::after {
  content: ""; position: absolute; top: 100%; left: 0; right: 0; height: 26px;
  background: linear-gradient(to bottom, rgba(10, 12, 14, 0.5), rgba(10, 12, 14, 0));
  pointer-events: none;
}
.filters {
  position: relative; display: inline-flex; gap: 2px; padding: 4px; max-width: 100%;
  border: 1px solid var(--line); border-radius: 999px; background: rgba(16, 20, 26, 0.7);
  overflow-x: auto; scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.findicator {
  position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); width: 0;
  border-radius: 999px; background: var(--ember);
  transition: transform 0.34s var(--ease-spring), width 0.34s var(--ease-spring);
}
.filter {
  position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
  color: var(--steel); font-family: var(--font-m); font-size: 13px; font-weight: 600;
  letter-spacing: 0.08em; padding: 0 18px; min-height: 44px; border-radius: 999px;
  white-space: nowrap; transition: color 0.2s var(--ease-out), transform 0.12s ease-out;
  -webkit-tap-highlight-color: transparent;
}
.filter:active { transform: scale(0.94); }
.filter.is-on { color: #0a0c0e; }
.filter:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.deck-count {
  margin: 0 0 0 auto; font-family: var(--font-m); font-size: 12px;
  letter-spacing: 0.18em; color: var(--dim); white-space: nowrap;
}
.deck-count b { color: var(--ember); font-weight: 600; }

/* ---------- Bench index: precision rows, not cards ----------
   One row per bench. Hairlines, tabular numerals, zero chrome. */
.btitle {
  position: relative; margin-top: 26px; border: 1px solid var(--line);
  padding: 14px 18px 13px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  background: rgba(16, 20, 26, 0.5);
}
.btitle .tick { position: absolute; width: 9px; height: 9px; border: 0 solid var(--steel); }
.btitle .tick.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
.btitle .tick.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
.btitle .tick.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
.btitle .tick.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
.btitle-name { font-size: 15px; font-weight: 700; letter-spacing: 0.24em; margin: 0; }
.btitle-meta {
  margin-left: auto; display: flex; font-family: var(--font-m);
  font-size: 11px; letter-spacing: 0.14em; color: var(--dim); white-space: nowrap;
}
.btitle-meta span { padding: 0 14px; border-left: 1px solid var(--line); }
.btitle-meta span:first-child { border-left: 0; padding-left: 0; }
.btitle-meta b { color: var(--paper); font-weight: 600; font-variant-numeric: tabular-nums; }

.bindex { margin-top: 6px; }
.bgroup { margin-top: 26px; }
.bgroup.hide { display: none; }
.bgroup-head {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 2px; padding: 0 12px 8px;
  font-family: var(--font-m); font-size: 11px; font-weight: 600;
  letter-spacing: 0.22em; color: var(--steel); text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.bgroup-head .cnt {
  margin-left: auto; color: var(--dim); letter-spacing: 0.14em;
  font-variant-numeric: tabular-nums;
}
.brow {
  display: grid; grid-template-columns: 52px minmax(170px, 1.1fr) 96px minmax(0, 2fr) 72px;
  align-items: center; gap: 16px; width: 100%; min-height: 54px;
  padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid var(--line);
  border-radius: 0; color: var(--paper); font-family: var(--font-d); text-align: left;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color 0.1s ease-out;
}
.brow:hover { background: rgba(242, 237, 227, 0.035); }
.brow:focus-visible { outline: 2px solid var(--ember); outline-offset: -2px; }
.brow.hide { display: none; }
.bnum {
  font-family: var(--font-m); font-size: 13px; font-weight: 500; color: var(--dim);
  font-variant-numeric: tabular-nums; letter-spacing: 0.06em;
}
.brow:hover .bnum, .brow:focus-visible .bnum { color: var(--steel); }
.bname {
  font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bmission {
  font-family: var(--font-m); font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
  color: var(--steel); text-transform: uppercase; white-space: nowrap;
}
.bspec {
  font-family: var(--font-m); font-size: 12px; color: var(--dim); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.blaunch { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.barrow {
  font-family: var(--font-m); font-size: 16px; color: var(--dim);
  transition: color 0.1s ease-out, transform 0.1s ease-out;
}
.benter {
  font-family: var(--font-m); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em;
  color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px;
  opacity: 0; transition: opacity 0.1s ease-out;
}
.brow:hover .barrow, .brow:focus-visible .barrow { color: var(--ember); transform: translateX(3px); }
.brow:hover .benter, .brow:focus-visible .benter { opacity: 1; }
@media (max-width: 640px) {
  .brow {
    grid-template-columns: 44px minmax(0, 1fr) 56px;
    grid-template-areas: "num name launch" "num spec launch";
    row-gap: 2px; min-height: 64px; padding: 10px 12px;
  }
  .bnum { grid-area: num; }
  .bname { grid-area: name; }
  .bspec {
    grid-area: spec; white-space: normal; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bmission { display: none; }
  .blaunch { grid-area: launch; }
  .btitle-meta { margin-left: 0; }
}

/* ---------- Footer: the ventures, as unmistakable external rows ---------- */
.site-foot { margin: 84px 0 0; padding: 0 0 52px; }
.elsewhere .kicker {
  font-family: var(--font-m); font-size: 12px; font-weight: 600;
  letter-spacing: 0.22em; color: var(--dim); margin: 0 0 6px;
}
.vrow {
  display: flex; align-items: center; gap: 16px; padding: 20px 4px;
  border-top: 1px solid var(--line); text-decoration: none; color: var(--paper);
  transition: background 0.18s var(--ease-out), padding 0.18s var(--ease-out);
}
.vrow:last-of-type { border-bottom: 1px solid var(--line); }
.vrow:hover { background: rgba(255, 90, 31, 0.045); }
.vrow:focus-visible { outline: 2px solid var(--ember); outline-offset: -2px; }
.vrow .grow { flex: 1; min-width: 0; }
.vname { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.vsub { display: block; font-family: var(--font-m); font-size: 12px; color: var(--dim); letter-spacing: 0.04em; margin-top: 5px; }
.vext { font-family: var(--font-m); color: var(--ember); font-size: 19px; transition: transform 0.2s var(--ease-out); flex: none; }
.vrow:hover .vext { transform: translate(3px, -3px); }
.fineprint { color: var(--dim); font-size: 13px; margin: 28px 0 0; font-family: var(--font-m); line-height: 1.7; }
.fineprint a { color: var(--steel); }

/* ---------- Toast ---------- */
#pgToast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 300;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--panel-2); color: var(--paper); border: 1px solid var(--line);
  border-left: 3px solid var(--ember); border-radius: 4px;
  font-family: var(--font-m); font-size: 13.5px; padding: 12px 18px; max-width: min(92vw, 480px);
  transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}
#pgToast.show { opacity: 1; transform: translate(-50%, 0); }

/* Staging area for bench launch buttons injected by feature modules. */
.dossier .actions { display: none; }

/* ============================================================
   In-app browser hardening for bench overlays.
   Modules open overlays by toggling an `open` class on an
   element named *-overlay. These rules (page-level, higher
   specificity than module-injected styles) fix the three
   reported WebView issues: clipped tops, wrong colors on
   native controls, and unruly scrolling.
   ============================================================ */
div[class*="-overlay"] {
  height: 100vh;
  height: 100dvh;
  padding-top: max(16px, env(safe-area-inset-top)) !important;
  padding-bottom: max(16px, env(safe-area-inset-bottom)) !important;
  padding-left: max(12px, env(safe-area-inset-left)) !important;
  padding-right: max(12px, env(safe-area-inset-right)) !important;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
/* Flex-centered overlay panels clip their tops when taller than the
   viewport. Top-align + auto margins: centered when short, reachable
   when tall. */
.rv-overlay.open { align-items: flex-start !important; overflow-y: auto !important; }
.rv-overlay.open > .rv-panel { margin-top: auto !important; margin-bottom: auto !important; }
/* Bench opening transition: the overlay grows out of the tapped card. */
div[class*="-overlay"].pg-enter { animation: pgOverlayIn 0.3s var(--ease-out); }
@keyframes pgOverlayIn {
  from { opacity: 0; transform: scale(0.96) translateY(26px); }
  to { opacity: 1; transform: none; }
}

@media (max-width: 560px) {
  .site-head { padding-top: 40px; }
  .vname { font-size: 17px; }
}
/* Second beat: after the backdrop fades, the panel rises into place. */
div[class*="-overlay"].pg-enter > div {
  animation: pgInnerIn 0.32s var(--ease-out) 0.06s backwards;
}
@keyframes pgInnerIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

/* Universal close: a fixed CLOSE control whenever any bench is open,
   so nobody gets stuck. Large target, safe-area aware. */
#pgCloseFab {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10010;
  width: 64px; height: 64px; border-radius: 4px;
  border: 1px solid var(--ember); background: var(--ember); color: #0a0c0e;
  font-family: var(--font-m); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  cursor: pointer; display: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
  -webkit-tap-highlight-color: transparent;
}
body.pg-any-open #pgCloseFab { display: block; }
#pgCloseFab:active { transform: scale(0.92); }
/* FAB safe zone: open overlays reserve room above the fixed CLOSE
   control, so it can never cover bench UI. */
body.pg-any-open div[class*="-overlay"].open {
  padding-bottom: calc(92px + env(safe-area-inset-bottom));
}

/* Press anticipation: controls depress before the action fires. */
.filter:active, .rv-btn:active, .rv-tab:active, .rv-mini:active { transform: scale(0.94); }
.rv-close:active { transform: scale(0.96); }

/* Motion sensitivity: honor it, always. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

function pgLaunch(b, card) {
  var r = card ? card.getBoundingClientRect() : null;
  pgLastPoint = r ? { x: r.left + r.width / 2, y: r.top + r.height / 2 }

/* Deep links: proving-ground/#bench=riscv-playground (or #bench=08)
   opens the bench directly, so the venture sites can link to the exact
   instrument behind their promises. Waits for the deferred bundle. */
function pgSlug(name) {
  return name.toLowerCase().replace(/^the\s+/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function pgDeepLink() {
  var m = (location.hash || "").match(/bench=([A-Za-z0-9-]+)/);
  if (!m) return;
  var norm = function (s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ""); };
  var key = norm(m[1]);
  var hit = null;
  for (var i = 0; i < PG_BENCHES.length; i++) {
    if (norm(PG_BENCHES[i].n) === key || norm(pgSlug(PG_BENCHES[i].name)) === key) { hit = PG_BENCHES[i]; break; }
  }
  if (!hit) return;
  var row = document.querySelector('.brow[data-n="' + hit.n + '"]');
  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    if ($(hit.btn)) {
      clearInterval(timer);
      pgLaunch(hit, row);
    } else if (tries > 30) {
      clearInterval(timer);
    }
  }, 200);
}

function pgSetFilter(f) {
  if (pgFilter === f) return;
  pgFilter = f;
  var btns = document.querySelectorAll(".filter");
  for (var i = 0; i < btns.length; i++) {
    var on = btns[i].getAttribute("data-f") === f;
    btns[i].classList.toggle("is-on", on);
    btns[i].setAttribute("aria-pressed", on ? "true" : "false");
  }
  pgMoveIndicator();
  pgApplyFilter(false);
}

function pgMoveIndicator() {
  var wrap = document.querySelector(".filters");
  if (!wrap) return;
  var on = wrap.querySelector(".filter.is-on");
  var ind = wrap.querySelector(".findicator");
  if (!on || !ind) return;
  ind.style.width = on.offsetWidth + "px";
  ind.style.transform = "translateX(" + (on.offsetLeft - 4) + "px)";
}

function pgVisibleRows() {
  var rows = document.querySelectorAll(".brow");
  var vis = [];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].style.display !== "none") vis.push(rows[i]);
  }
  return vis;
}

/* Roving tabindex across the visible rows: one tab stop for the index,
   arrows move, Enter launches (native button behavior). */
function pgRovingReset() {
  var rows = pgVisibleRows();
  for (var i = 0; i < rows.length; i++) {
    rows[i].setAttribute("tabindex", i === 0 ? "0" : "-1");
  }
}

function pgRovingInit() {
  var index = document.querySelector(".bindex");
  if (!index || index._pgKeys) return;
  index._pgKeys = true;
  index.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains("brow")) return;
    var rows = pgVisibleRows();
    var i = rows.indexOf(t);
    if (i === -1) return;
    var j = -1;
    if (e.key === "ArrowDown") j = Math.min(rows.length - 1, i + 1);
    else if (e.key === "ArrowUp") j = Math.max(0, i - 1);
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = rows.length - 1;
    if (j === -1 || j === i) return;
    e.preventDefault();
    rows[i].setAttribute("tabindex", "-1");
    rows[j].setAttribute("tabindex", "0");
    rows[j].focus();
  });
}

function pgApplyFilter(first) {
  var rows = document.querySelectorAll(".brow");
  var visCount = 0;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var show = pgFilter === "all" || r.getAttribute("data-section") === pgFilter;
    r.classList.toggle("hide", !show);
    r.style.display = show ? "" : "none";
    if (show) visCount++;
  }
  var groups = document.querySelectorAll(".bgroup");
  for (var g = 0; g < groups.length; g++) {
    var any = groups[g].querySelector(".brow:not(.hide)") !== null;
    groups[g].classList.toggle("hide", !any);
    groups[g].style.display = any ? "" : "none";
  }
  var dc = $("deckCount");
  if (dc) {
    var nn = visCount < 10 ? "0" + visCount : visCount;
    var tt = PG_BENCHES.length < 10 ? "0" + PG_BENCHES.length : PG_BENCHES.length;
    dc.innerHTML = "<b>" + nn + "</b>&nbsp;/ " + tt + "&nbsp;BENCH" + (visCount === 1 ? "" : "ES");
  }
  pgRovingReset();
  var bc = $("benchCount");
  if (bc && first) {
    var total = PG_BENCHES.length;
    bc.textContent = total < 10 ? "0" + total : total;
  }
}

function pgRender() {
  var main = $("benches");

  var deck = el("div", "deck");
  var filters = el("div", "filters");
  filters.setAttribute("role", "group");
  filters.setAttribute("aria-label", "Filter benches by mission");
  filters.appendChild(el("span", "findicator"));
  var defs = [{ id: "all", label: "All" }].concat(PG_SECTIONS);
  defs.forEach(function (d) {
    var b = el("button", "filter" + (d.id === "all" ? " is-on" : ""));
    b.type = "button";
    b.textContent = d.label;
    b.setAttribute("data-f", d.id);
    b.setAttribute("aria-pressed", d.id === "all" ? "true" : "false");
    (function (id) { b.addEventListener("click", function () { pgSetFilter(id); }); })(d.id);
    filters.appendChild(b);
  });
  deck.appendChild(filters);
  var count = el("p", "deck-count");
  count.id = "deckCount";
  deck.appendChild(count);
  main.appendChild(deck);

  /* Blueprint title block: every label is real data rendered from the registry. */
  var total = PG_BENCHES.length;
  var ttn = total < 10 ? "0" + total : total;
  var title = el("section", "btitle");
  title.setAttribute("aria-label", "Bench index");
  title.innerHTML =
    '<i class="tick tl" aria-hidden="true"></i><i class="tick tr" aria-hidden="true"></i>' +
    '<i class="tick bl" aria-hidden="true"></i><i class="tick br" aria-hidden="true"></i>' +
    '<h2 class="btitle-name">BENCH INDEX</h2>' +
    '<div class="btitle-meta"><span><b>' + ttn + '</b>&nbsp;BENCHES</span>' +
    '<span>SHEET 01/01</span>' +
    '<span>REV ' + PG_REV + '</span></div>';
  main.appendChild(title);

  /* Dense precision rows, grouped by mission under hairline subheads. */
  var index = el("div", "bindex");
  PG_SECTIONS.forEach(function (s) {
    var group = el("section", "bgroup");
    group.setAttribute("data-section", s.id);
    group.setAttribute("aria-label", s.label + " benches");
    var inGroup = 0;
    for (var k = 0; k < PG_BENCHES.length; k++) {
      if (PG_BENCHES[k].section === s.id) inGroup++;
    }
    var gnn = inGroup < 10 ? "0" + inGroup : inGroup;
    var head = el("h2", "bgroup-head");
    head.innerHTML = s.label + '<span class="cnt">' + gnn + '</span>';
    group.appendChild(head);
    PG_BENCHES.forEach(function (b) {
      if (b.section !== s.id) return;
      var row = el("button", "brow");
      row.type = "button";
      row.setAttribute("data-section", b.section);
      row.setAttribute("data-n", b.n);
      row.setAttribute("tabindex", "-1");
      row.setAttribute("aria-label", "Bench " + b.n + ", " + b.name + ". " + b.desc + " Press Enter to launch.");
      row.innerHTML =
        '<span class="bnum">' + b.n + '</span>' +
        '<span class="bname">' + b.name + '</span>' +
        '<span class="bmission">' + pgMissionLabel(b.section) + '</span>' +
        '<span class="bspec">' + b.desc + '</span>' +
        '<span class="blaunch" aria-hidden="true"><span class="benter">ENTER</span><span class="barrow">&rarr;</span></span>';
      (function (bench, r) {
        r.addEventListener("click", function () { pgLaunch(bench, r); });
      })(b, row);
      group.appendChild(row);
    });
    index.appendChild(group);
  });
  main.appendChild(index);

  pgRovingInit();
  pgSlashKey();
  pgMoveIndicator();
  pgApplyFilter(true);
  window.addEventListener("resize", pgMoveIndicator);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(pgMoveIndicator);
  }
}

/* "/" focuses the mission filter. Never steals keystrokes from inputs,
   editors, or open benches. */
function pgSlashKey() {
  if (pgSlashKey._on) return;
  pgSlashKey._on = true;
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    var tag = t && t.tagName ? t.tagName : "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" ||
        (t && t.isContentEditable)) return;
    var f = document.querySelector(".filter.is-on");
    if (!f) return;
    e.preventDefault();
    f.focus();
  });
}

/* Bench overlay watcher: grows the overlay out of the tapped row,
   and locks background scroll while any bench is open. Modules
   toggle overlays with an `open` class; we never touch their code.
   Transition-guarded: the enter animation only runs on the
   closed-to-open edge. Without the guard, the animation's own
   class changes re-trigger the observer forever and hang the tab. */
(function pgOverlayWatcher() {
  function isOverlay(t) {
    return t && t.classList && t.className && t.className.indexOf("-overlay") !== -1;
  }
  function refreshLock() {
    var ovs = document.querySelectorAll('div[class*="-overlay"]');
    var anyOpen = false;
    for (var i = 0; i < ovs.length; i++) {
      if (ovs[i].classList.contains("open")) { anyOpen = true; break; }
    }
    document.body.classList.toggle("pg-locked", anyOpen);
    document.body.classList.toggle("pg-any-open", anyOpen);
    /* Scroll-lock failsafe: benches 27, 28, and 29 also set an inline
       body overflow when they open, and only their own close buttons
       clear it. Any close path that bypasses those buttons (the
       floating CLOSE control, the universal backdrop tap, Escape)
       strips the open class without touching the inline style, which
       used to freeze page scroll permanently. Every close path on
       this page funnels through the open-class change this watcher
       sees, so releasing the inline lock here covers all of them,
       present and future. Never set the inline lock here: the class
       alone governs the locked state while a bench is open. */
    if (!anyOpen) document.body.style.overflow = "";
  }
  var mo = new MutationObserver(function (muts) {
    for (var k = 0; k < muts.length; k++) {
      var t = muts[k].target;
      if (!isOverlay(t)) continue;
      var isOpen = t.classList.contains("open");
      var wasOpen = !!t._pgOpen;
      if (isOpen === wasOpen) continue;
      t._pgOpen = isOpen;
      if (isOpen) {
        if (pgLastPoint && !pgReduced) {
          var r = t.getBoundingClientRect();
          t.style.transformOrigin = (pgLastPoint.x - r.left) + "px " + (pgLastPoint.y - r.top) + "px";
          t.classList.remove("pg-enter");
          void t.offsetWidth;
          t.classList.add("pg-enter");
        }
      } else {
        t.classList.remove("pg-enter");
        t.style.transformOrigin = "";
      }
      refreshLock();
    }
  });
  mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
})();

/* Bench-bundle load failure: if features.js can't be fetched (privacy
   blocker, poisoned cache, offline), say so with a retry instead of
   silently dead cards. */
function pgBundleFailed() {
  if (document.getElementById("pgBundleWarn")) return;
  var w = document.createElement("div");
  w.id = "pgBundleWarn";
  w.setAttribute("role", "alert");
  w.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;" +
    "background:#2a1408;border:1px solid #ff5a1f;color:#f2ede3;font-family:monospace;" +
    "font-size:13px;padding:12px 14px;border-radius:10px;display:flex;gap:12px;" +
    "align-items:center;justify-content:space-between";
  w.innerHTML = "<span>Bench instruments failed to load. Check your connection, then retry.</span>";
  var b = document.createElement("button");
  b.textContent = "Retry";
  b.style.cssText = "background:#ff5a1f;border:0;color:#0a0c0e;font-weight:700;" +
    "padding:10px 18px;border-radius:8px;min-height:44px;cursor:pointer";
  b.onclick = function () { window.location.reload(); };
  w.appendChild(b);
  document.body.appendChild(w);
}

/* Universal close system: nobody gets stuck in a bench.
   A fixed CLOSE control, backdrop tap, and Escape all funnel into one
   close path. Module-specific close buttons keep working; this is the
   safety net underneath them. (Swipe-down closing was removed: it fired
   by accident during normal scrolling.) */
function pgCloseAllOverlays() {
  var ovs = document.querySelectorAll('div[class*="-overlay"].open');
  for (var i = 0; i < ovs.length; i++) ovs[i].classList.remove("open");
}
(function pgUniversalClose() {
  var fab = document.createElement("button");
  fab.id = "pgCloseFab";
  fab.type = "button";
  fab.textContent = "CLOSE";
  fab.setAttribute("aria-label", "Close the open bench");
  fab.addEventListener("click", pgCloseAllOverlays);
  document.body.appendChild(fab);

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t && t.classList && t.className.indexOf("-overlay") !== -1 &&
        t.classList.contains("open")) {
      t.classList.remove("open");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") pgCloseAllOverlays();
  });
})();

function pgBoot() {
  try {
    pgRender(); pgDeepLink();
  } catch (err) {
    var m = document.createElement("div");
    m.setAttribute("role", "alert");
    m.style.cssText = "max-width:640px;margin:40px auto;padding:20px;font-family:monospace;" +
      "color:#f2ede3;background:#1a0f0a;border:1px solid #ff5a1f;border-radius:12px";
    m.textContent = "The Proving Ground failed to start in this browser (" +
      (err && err.message ? err.message : err) + "). Try reloading, or another browser.";
    document.body.appendChild(m);
  }
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", pgBoot);
} else {
  pgBoot();
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    // Check for updates when app returns to foreground (iOS PWA fix)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
    // Reload once when a new service worker takes over, to show fresh content
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloaded) { reloaded = true; window.location.reload(); }
    });
  });
}
// Invisible auto-update: check build version on foreground, reload once if changed
(function() {
  const currentVersion = document.querySelector('meta[name="build-version"]')?.content;
  if (!currentVersion) return;
  let checked = false;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || checked) return;
    checked = true;
    fetch(location.href, { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const m = html.match(/<meta name="build-version" content="([^"]+)"/);
        if (m && m[1] !== currentVersion) window.location.reload();
        else checked = false;
      })
      .catch(() => { checked = false; });
  });
})();
</script>
