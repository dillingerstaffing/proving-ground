<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ece6d5">
<link rel="icon" href="/proving-ground/favicon.ico">
<link rel="apple-touch-icon" href="/proving-ground/apple-touch-icon.png">
<title>Bench not found &middot; The Proving Ground</title>
<style>
  @font-face {
    font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400;
    font-display: swap; src: url("/proving-ground/fonts/ibm-plex-mono-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600;
    font-display: swap; src: url("/proving-ground/fonts/ibm-plex-mono-600.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: #ece6d5; }
  body {
    margin: 0; background: #ece6d5; color: #241f17;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow-x: clip;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%; max-width: 560px;
    border: 1px solid #c9bfa4; border-radius: 4px;
    background: #ece6d5; padding: 40px 36px 32px;
  }
  .kicker {
    font-size: 12px; letter-spacing: 0.28em; color: #686156;
    margin: 0 0 18px; font-weight: 600;
  }
  .kicker .n { color: #8c3f22; }
  h1 {
    font-size: 30px; line-height: 1.2; font-weight: 600;
    margin: 0 0 14px; letter-spacing: -0.01em;
  }
  .rule { border: 0; border-top: 2px solid #8c3f22; width: 120px; margin: 0 0 18px; }
  p.lede { font-size: 15px; line-height: 1.65; color: #241f17; margin: 0 0 28px; max-width: 44ch; }
  p.lede .dim { color: #686156; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-block; text-decoration: none; font-family: inherit;
    font-size: 13px; font-weight: 600; letter-spacing: 0.12em;
    padding: 14px 22px; border-radius: 4px; border: 1px solid #8c3f22;
  }
  .btn.solid { background: #8c3f22; color: #ece6d5; }
  .btn.ghost { background: transparent; color: #8c3f22; }
  .btn:focus-visible { outline: 2px solid #8c3f22; outline-offset: 2px; }
  .foot {
    margin-top: 32px; padding-top: 16px; border-top: 1px solid #c9bfa4;
    font-size: 11px; letter-spacing: 0.22em; color: #686156;
  }
  @media (max-width: 480px) {
    .card { padding: 32px 24px 28px; }
    h1 { font-size: 25px; }
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="kicker"><span class="n">404</span> &nbsp;PAGE NOT FOUND</p>
    <h1>Bench not found.</h1>
    <hr class="rule">
    <p class="lede">This page does not exist on The Proving Ground.<br><span class="dim">The benches are all one click away.</span></p>
    <div class="actions">
      <a class="btn solid" href="https://dillingerstaffing.github.io/proving-ground/">BACK TO THE BENCHES</a>
      <a class="btn ghost" href="mailto:shipthisgroup@gmail.com?subject=Proving%20Ground%20inquiry">EMAIL CHRIS</a>
    </div>
    <p class="foot">THE PROVING GROUND &middot; WORKING ENGINEERING BENCHES</p>
  </main>
</body>
</html>
